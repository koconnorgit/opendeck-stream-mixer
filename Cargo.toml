[package]
name = "oa-volume-controller"
version = "1.6.0"
edition = "2024"

[dependencies]
pulsectl-rs = "0.3"
openaction = "2.5.0"
tokio = { version = "1.45", features = ["full"] }
log = "0.4"
simplelog = "0.12"
serde = "1.0"
serde_json = "1.0"
lazy_static = "1.5"
async-trait = "0.1"
libpulse-binding = "2.30"
anyhow = "1.0"
image = "0.24"
base64 = "0.22"
tux-icons = "0.4.4"
ab_glyph = "0.2"
zbus = { version = "5", features = ["tokio"] }
futures-lite = "2.6.1"
x11rb = "0.13"

# Patched openaction SDK: adds the `touchTap` encoder event the published crate lacks.
# Fork: https://github.com/koconnorgit/rust (changes live on the default `main` branch)
[patch.crates-io]
openaction = { git = "https://github.com/koconnorgit/rust", branch = "main" }
